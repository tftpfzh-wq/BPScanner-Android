plugins { id 'com.android.application' }
def releaseTag = System.getenv('GITHUB_REF_NAME') ?: ''
def tagParts = releaseTag.replaceFirst('^[vV]', '').split('\\.')
def releaseCode = 1
if (releaseTag.startsWith('v') && tagParts.length == 3) {
    releaseCode = tagParts[0].toInteger() * 10000 + tagParts[1].toInteger() * 100 + tagParts[2].replaceAll('[^0-9].*$', '').toInteger()
}
android {
    namespace 'com.bpscanner.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bpscanner.app'
        minSdk 23
        targetSdk 28
        versionCode releaseCode
        versionName releaseTag.startsWith('v') ? releaseTag.substring(1) : '0.1.0'
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_FILE') != null) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_FILE') != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
}